name: Contract validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  m8-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JSON Schemas and Python golden hash
        run: |
          python -m pip install jsonschema==4.25.1
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from jsonschema.validators import Draft202012Validator
          from referencing import Registry, Resource

          root = Path("contracts/m8")
          registry = Registry()
          schemas = {}
          for path in sorted(root.glob("*.schema.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              schemas[path.name] = schema
              registry = registry.with_resource(schema["$id"], Resource.from_contents(schema))

          manifest = json.loads(
              (root / "golden/factor-frame-manifest-v1.json").read_text(encoding="utf-8")
          )
          Draft202012Validator(
              schemas["factor-frame-manifest.schema.json"], registry=registry
          ).validate(manifest)

          golden = json.loads(
              (root / "golden/factor-frame-hash-v1.json").read_text(encoding="utf-8")
          )
          canonical_schema = json.loads(
              (root / "canonical-envelope.schema.json").read_text(encoding="utf-8")
          )
          Draft202012Validator(canonical_schema).validate(golden["canonical_input"])
          payload = json.dumps(
              golden["canonical_input"],
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          assert payload.hex() == golden["canonical_utf8_hex"]
          assert hashlib.sha256(payload).hexdigest() == golden["sha256"]
          PY

      - name: Independently verify golden hash with Node.js
        run: |
          node <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          const golden = JSON.parse(
            fs.readFileSync("contracts/m8/golden/factor-frame-hash-v1.json", "utf8")
          );
          const canonicalize = (value) => {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value !== null && typeof value === "object") {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonicalize(value[key])])
              );
            }
            return value;
          };
          const payload = Buffer.from(JSON.stringify(canonicalize(golden.canonical_input)), "utf8");
          if (payload.toString("hex") !== golden.canonical_utf8_hex) process.exit(2);
          if (crypto.createHash("sha256").update(payload).digest("hex") !== golden.sha256) {
            process.exit(3);
          }
          JS
