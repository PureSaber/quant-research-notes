name: Contract validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  m8-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install locked contract dependencies
        run: |
          python -m pip install --requirement contracts/m8/requirements.lock
          python -m pip check

      - name: Validate schemas, semantics and negative vectors
        run: |
          python contracts/m8/validate_contracts.py
          python -m unittest discover -s contracts/m8/tests -v

      - name: Independently verify golden hash with Node.js
        run: |
          node <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          const golden = JSON.parse(
            fs.readFileSync("contracts/m8/golden/factor-frame-hash-v1.json", "utf8")
          );
          const canonicalize = (value) => {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value !== null && typeof value === "object") {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonicalize(value[key])])
              );
            }
            return value;
          };
          const payload = Buffer.from(JSON.stringify(canonicalize(golden.canonical_input)), "utf8");
          if (payload.toString("hex") !== golden.canonical_utf8_hex) process.exit(2);
          if (crypto.createHash("sha256").update(payload).digest("hex") !== golden.sha256) {
            process.exit(3);
          }
          JS
