name: Contract validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  m8-release-manifest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Recreate checkout with Windows autocrlf enabled
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config core.autocrlf true
          $paths = @(
            "validation/m8/stack-manifest-v2-release-a.json",
            "validation/m8/stack-manifest-v2-release-b.json"
          )
          Remove-Item -LiteralPath $paths
          git checkout-index --force -- $paths
          $eol = git ls-files --eol -- $paths
          if ($eol -match "w/crlf") {
            throw "M8 release manifests were checked out with CRLF"
          }

      - name: Verify immutable release manifests
        run: python -m unittest discover -s contracts/m8/tests -p "test_release_manifest.py" -v

  m8-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install locked contract dependencies
        run: |
          python -m pip install --require-hashes --requirement contracts/m8/requirements.lock
          python -m pip check

      - name: Lint and format check
        run: |
          python -m ruff check contracts/m8
          python -m ruff format --check contracts/m8

      - name: Validate schemas, semantics, negative vectors and coverage
        run: |
          python -m coverage run --branch contracts/m8/validate_contracts.py
          python -m coverage run --branch --append -m unittest discover -s contracts/m8/tests -v
          python -m coverage report --include="contracts/m8/validate_contracts.py" --fail-under=90

      - name: Independently verify golden hash with Node.js
        run: |
          node <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          const golden = JSON.parse(
            fs.readFileSync("contracts/m8/golden/factor-frame-hash-v1.json", "utf8")
          );
          const manifest = JSON.parse(
            fs.readFileSync(`contracts/m8/golden/${golden.manifest_file}`, "utf8")
          );
          const canonicalize = (value) => {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value !== null && typeof value === "object") {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonicalize(value[key])])
              );
            }
            return value;
          };
          const typedCell = (value) => {
            if (value === null) return {t: "null"};
            if (typeof value === "boolean") return {t: "bool", v: value};
            if (typeof value === "number") {
              if (!Number.isSafeInteger(value)) process.exit(4);
              return {t: "i64", v: String(value)};
            }
            if (typeof value === "string") return {t: "utf8", v: value};
            if (Array.isArray(value)) return {t: "list", v: value.map(typedCell)};
            if (typeof value === "object") {
              return {
                t: "struct",
                v: Object.keys(value).sort().map((key) => [key, typedCell(value[key])]),
              };
            }
            process.exit(5);
          };
          const digest = (value) => crypto
            .createHash("sha256")
            .update(Buffer.from(JSON.stringify(canonicalize(value)), "utf8"))
            .digest("hex");
          const projection = Object.fromEntries(
            Object.entries(manifest).filter(
              ([key]) => !["logical_content_sha256", "physical_sha256"].includes(key)
            )
          );
          if (digest(typedCell(projection)) !== golden.manifest_projection_sha256) {
            process.exit(6);
          }
          const maxInt64Projection = structuredClone(projection);
          maxInt64Projection.frequency.interval_ns = "9223372036854775807";
          const precedingInt64Projection = structuredClone(projection);
          precedingInt64Projection.frequency.interval_ns = "9223372036854775806";
          if (digest(typedCell(maxInt64Projection)) === digest(typedCell(precedingInt64Projection))) {
            process.exit(7);
          }
          const utf16OrderedKeys = typedCell({"\uE000": 1, "😀": 2}).v.map(([key]) => key);
          if (utf16OrderedKeys[0] !== "😀" || utf16OrderedKeys[1] !== "\uE000") {
            process.exit(8);
          }
          const payload = Buffer.from(JSON.stringify(canonicalize(golden.canonical_input)), "utf8");
          if (payload.toString("hex") !== golden.canonical_utf8_hex) process.exit(2);
          if (crypto.createHash("sha256").update(payload).digest("hex") !== golden.sha256) {
            process.exit(3);
          }
          JS
